syntax = "proto3";
option java_package = "com.grpc.demo.service.event";
option java_multiple_files = true;

package event;

import "user.proto";

message Empty {}

message ExternalEvent {
    int32 id = 1;
    string name = 2;
    string description = 3;
    string fecha_hora = 4; // formato ISO 8601
    bool is_published = 5;
    int32 remote_id = 6;
    int32 organization_id = 7;
    repeated string users = 8;
}

message Event {
    int32 id = 1;
    string name = 2;
    string description = 3;
    string fecha_hora = 4;
    bool is_published = 5;
    repeated string users = 6;
}

message EventList {
    repeated Event event = 1;
}

message ExternalEventList {
    repeated ExternalEvent externalEvent = 1;
}

message UserEventRequest {
    int32 event_id = 1;
    string username = 2;
}

message DonationEventRequest {
    int32 event_id = 1;
    int32 donation_id = 2;
}

message Response {
    bool success = 1;
    string message = 2;
}

service EventService {
    rpc CreateEvent(Event) returns (Response);
    rpc UpdateEvent(Event) returns (Response);
    rpc DeleteEvent(Event) returns (Response);
    rpc ListEvents(Empty) returns (EventList);
    rpc ListExternalEvents(Empty) returns (ExternalEventList);
    rpc AddUser(UserEventRequest) returns (Response);
    rpc RemoveUser(UserEventRequest) returns (Response);
    rpc UseDonations(DonationEventRequest) returns (Response);
}

spring.application.name=demo
server.address=0.0.0.0
server.port=8081


# gRPC: usar nombre del servicio en docker-compose
grpc.client.user-service.address=static://grpc-server:50051
grpc.client.user-service.negotiation-type=plaintext
grpc.client.auth-service.address=static://grpc-server:50051
grpc.client.auth-service.negotiation-type=plaintext
grpc.client.donation-service.address=static://grpc-server:50051
grpc.client.donation-service.negotiation-type=plaintext
grpc.client.event-service.address=static://grpc-server:50051
grpc.client.event-service.negotiation-type=plaintext

logging.level.com.grpc.demo=DEBUG

# Kafka: usar nombre del servicio si está en docker-compose
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=ong-empuje-comunitario
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Configuracion ONG
ong.id=1
ong.nombre=Empuje Comunitario
